<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jatayu – Plan Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{--desk:#08090b;--win:#101216;--tb:#0b0c0f;--tbon:#1f4276;--ink:#e8eaed;--mut:#98a2b3;--line:#434b5c;--frame:#1c2a44;--hdr:#2b4a7d;--hdrh:#35609f;--acc:#4296fa;--done:#6fdc8c;--next:#f5b942;--tab:#1c3157;--tabon:#2f64ad;--row:#ffffff09;
--ff:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;color-scheme:dark;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--desk:#aeb8c6;--win:#f0f1f3;--tb:#d4d7dc;--tbon:#9db9e3;--ink:#16181d;--mut:#4d5666;--line:#9aa3b2;--frame:#d9deea;--hdr:#b9cdee;--hdrh:#9dbbe8;--acc:#2a6fd6;--done:#1a7a37;--next:#9a5200;--tab:#c5d3ea;--tabon:#8fb2e6;--row:#00000008;color-scheme:light}}
:root[data-theme="light"]{--desk:#aeb8c6;--win:#f0f1f3;--tb:#d4d7dc;--tbon:#9db9e3;--ink:#16181d;--mut:#4d5666;--line:#9aa3b2;--frame:#d9deea;--hdr:#b9cdee;--hdrh:#9dbbe8;--acc:#2a6fd6;--done:#1a7a37;--next:#9a5200;--tab:#c5d3ea;--tabon:#8fb2e6;--row:#00000008;color-scheme:light}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--desk);color:var(--ink);font:13px/1.55 var(--ff)}
.wrap{max-width:1120px;margin:0 auto;padding:10px 10px 60px}
.menubar{display:flex;flex-wrap:wrap;align-items:center;gap:6px;background:var(--tb);border:1px solid var(--line);padding:4px 8px;margin-bottom:8px}
.menubar b{color:var(--acc);margin-right:8px}.meta{margin-left:auto;color:var(--mut);font-size:12px}
button,.menubar a{font:inherit;color:var(--ink);background:var(--hdr);border:0;border-radius:3px;padding:3px 10px;cursor:pointer;text-decoration:none}
button:hover,.menubar a:hover{background:var(--hdrh)}button:active{background:var(--acc);color:#fff}
.tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:2px solid var(--tabon);margin-bottom:8px}
.tabs button{background:var(--tab);border-radius:4px 4px 0 0;padding:4px 16px;white-space:nowrap}.tabs button:hover{background:var(--hdrh)}.tabs button.on{background:var(--tabon);color:#fff}
.win,.card{background:var(--win);border:1px solid var(--line);margin-bottom:8px}.card{padding:10px}
summary{cursor:pointer;list-style:none;display:flex;gap:6px;align-items:center;user-select:none}summary::-webkit-details-marker{display:none}
summary::before{content:"▶";font-size:9px;color:var(--mut);width:10px}details[open]>summary::before{content:"▼"}
.win>summary{background:var(--tb);padding:3px 8px}.win[open]>summary{background:var(--tbon);color:#fff}.win[open]>summary::before{color:#fff}
.r{margin-left:auto}.bd{padding:8px}
.hd{margin-bottom:3px}.hd>summary{background:var(--hdr);padding:3px 8px}.hd>summary:hover{background:var(--hdrh)}.hd>.bd{background:var(--win);border:1px solid var(--line);border-top:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,400px),1fr));gap:0 8px;align-items:start}
.pb{position:relative;height:18px;background:var(--frame);border-radius:2px;overflow:hidden;margin:2px 0}.pb i{display:block;height:100%;background:var(--acc)}
.pb span{position:absolute;inset:0;display:grid;place-items:center;font-size:12px;color:#fff;text-shadow:0 0 3px #000a}
.line{display:grid;grid-template-columns:1fr 1.3fr;gap:10px;align-items:center;margin:3px 0}
.tbl{width:100%;border-collapse:collapse;margin-top:8px}.tbl td{padding:3px 8px}.tbl td+td{text-align:right}.tbl tr:nth-child(even){background:var(--row)}.tbl tr:hover{background:var(--hdr)}
.mosaic{display:flex;flex-wrap:wrap;gap:2px;margin:10px 0 2px}.mosaic i{width:10px;height:10px;background:var(--frame);display:block}.mosaic i.d{background:var(--done)}
.done{color:var(--done)}.next{color:var(--next)}.plan,.mut{color:var(--mut)}.acc{color:var(--acc)}
ul{margin:6px 0;padding-left:20px}li::marker{color:var(--acc)}p{margin:6px 0}
code{color:var(--acc);word-break:break-all}
.tools{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-bottom:8px}.tools label{cursor:pointer}
input[type=search]{flex:1;min-width:180px;background:var(--frame);color:var(--ink);border:0;border-radius:2px;padding:4px 8px;font:inherit}
.ck{appearance:none;width:14px;height:14px;background:var(--frame);border:1px solid var(--line);border-radius:2px;margin:0 6px 0 0;vertical-align:-3px;cursor:pointer}
.ck:checked{background:var(--acc)}.ck:checked::after{content:"✓";display:block;color:#fff;font-size:11px;line-height:12px;text-align:center}
.fr,.ent{display:grid;grid-template-columns:18px 1fr;gap:0 6px;padding:4px 8px}.fr:nth-child(even),.ent:nth-child(even){background:var(--row)}.fr:hover,.ent:hover{background:var(--hdr)}
.fr .mut{grid-column:2}.ent{display:block}.ent .mut{display:block}
.cb{width:12px;height:12px;margin-top:4px;background:var(--frame);border:1px solid var(--line);border-radius:2px;display:block;font-size:10px;line-height:10px;text-align:center}.cb.on{color:var(--done)}.cb.on::after{content:"✓"}
.err{border-color:var(--next)}textarea{width:100%;min-height:110px;background:var(--frame);color:var(--ink);border:0;border-radius:2px;padding:8px;font:12px var(--ff)}
.sk{height:70px;background:var(--win);border:1px solid var(--line);margin-bottom:8px}
button:focus-visible,input:focus-visible,summary:focus-visible,a:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
<header class="menubar"><b>Jatayu</b><button id="reload">Refresh</button><button id="theme">Theme</button><a href="https://github.com/banecdr/Jatayu/blob/main/PLAN.md" target="_blank" rel="noopener">Open PLAN.md</a><span class="meta" id="meta">Loading plan…</span></header>
<div id="loadbox"></div>
<nav class="tabs" id="tabs"></nav>
<main id="view"><div class="sk"></div><div class="sk"></div><div class="sk"></div></main>
</div>
<script>
const URL_ = "https://raw.githubusercontent.com/banecdr/Jatayu/refs/heads/main/PLAN.md";
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const inline = s => esc(s.replace(/\$/g,"").replace(/\\(text|le|times|cdot|,)\{?/g,"").replace(/\*\*/g,"").replace(/\*/g,"")).replace(/`([^`]+)`/g,"<code>$1</code>");
const sprintKey = id => { const m = /^(\d+)([ab]?)$/.exec(id)||[0,99,""]; return +m[1]*10 + (m[2]==="b"?2:m[2]==="a"?1:0); };
let D = null, tab = "overview", filt = "all", q = "";

function parse(md){
  const lines = md.split(/\r?\n/), files = [], sprints = [], decs = [], log = [];
  let head = "", inCode = false, cur = null, dec = null, i = 0;
  const stated = {};
  for (const k of ["Planned","Completed"]){ const m = new RegExp("Total "+k+" Files:\\*\\*\\s*(\\d+)").exec(md); if(m) stated[k]=+m[1]; }
  for (i = 0; i < lines.length; i++){
    const l = lines[i];
    if (/^```/.test(l)){ inCode = !inCode; continue; }
    if (inCode){
      if (!l.includes("│")) continue;
      const t = l.replace(/^\s*│/,"").replace(/│\s*$/,"").trim();
      const m = /^SPRINT\s+(\d+[ab]?)\s*(\(OPTIONAL\))?\s*:\s*(.*?)\s*(?:\[([^\]]+)\])?$/.exec(t);
      if (m){ const s=(m[4]||"").toUpperCase(); cur = {id:m[1],title:m[3],opt:!!m[2],status:/DONE|COMPLETE/.test(s)?"done":/NEXT/.test(s)?"next":"plan",items:[],result:""}; sprints.push(cur); }
      else if (cur && t.startsWith("- ")){ const b=t.slice(2); if(/^Result:/i.test(b)) cur.result=b.replace(/^Result:\s*/i,""); else cur.items.push(b); }
      else if (cur && /^Note:/.test(t)) cur.note = t;
      continue;
    }
    if (/^#{2,4}\s/.test(l)){ head = l.replace(/^#+\s*/,""); dec = null; }
    if (/^---/.test(l)) dec = null;
    // tables
    if (l.startsWith("|") && /^\|[\s:|-]+\|$/.test(lines[i+1]||"")){
      const hdr = l.split("|").slice(1,-1).map(s=>s.trim().toLowerCase());
      const si = hdr.findIndex(h=>h.includes("status"));
      const isLog = hdr[0]==="entry";
      i += 2;
      for (; i < lines.length && lines[i].startsWith("|"); i++){
        const c = lines[i].split("|").slice(1,-1).map(s=>s.trim());
        if (isLog) log.push({id:c[0].replace(/\*/g,""),sprint:c[1],text:c[2]});
        else if (si>0){
          const st = c[si].replace(/\*/g,"").toUpperCase();
          if (st!=="DONE" && st!=="PLANNED") continue;
          const sp = /Sprint\s+(\d+[ab]?)/i.exec(c.join(" "));
          files.push({path:c[0].replace(/`/g,""),done:st==="DONE",role:c[c.length-1],sprint:sp?sp[1]:"",group:head.replace(/\s*\(.*$/,"").replace(/^\d+(\.\d+)*\s*/,"")});
        }
      }
      i--; continue;
    }
    const dm = /^\* \*\*(D\d+) \((.+?)\):\*\*/.exec(l);
    if (dm){ dec = {id:dm[1],title:dm[2],status:"",text:""}; decs.push(dec); continue; }
    if (dec){
      const sm = /\*Status:\*\s*(.+)/.exec(l), cm = /\*(?:Choice|Specification):\*\s*(.+)/.exec(l);
      if (sm) dec.status = sm[1].replace(/\*/g,"");
      else if (cm && !dec.text) dec.text = cm[1];
    }
  }
  return {files,sprints,decs,log,stated};
}

function stats(list){ const d=list.filter(f=>f.done).length; return {d,t:list.length,p:list.length?Math.round(d/list.length*100):0}; }
const bar=(p,t)=>`<div class="pb"><i style="width:${p}%"></i><span>${t??p+"%"}</span></div>`;
let sd=true,sp=true;
const win=(t,r,b,o=true)=>`<details class="win" ${o?"open":""}><summary>${t}<span class="r">${r||""}</span></summary><div class="bd">${b}</div></details>`;
const lis=a=>`<ul>${a.map(x=>`<li>${inline(x)}</li>`).join("")}</ul>`;

function overview(){
  const all=stats(D.files),groups={};D.files.forEach(f=>(groups[f.group] ||= []).push(f));
  const next=D.sprints.find(s=>s.status==="next"),doneSp=D.sprints.filter(s=>s.status==="done").length;
  const cells=D.files.map(f=>`<i class="${f.done?"d":""}" title="${esc(f.path)}"></i>`).join("");
  const note=D.stated.Completed?`<p class="mut">The plan’s own header says ${D.stated.Completed}/${D.stated.Planned}. These counts come from the file tables.</p>`:"";
  const sum=win("Summary",`${all.p}%`,`${bar(all.p,`${all.d} / ${all.t} files  (${all.p}%)`)}<div class="mosaic">${cells}</div><div class="mut">One square per file, plan order. Hover for the path.</div><table class="tbl"><tr><td>Files done</td><td class="done">${all.d}</td></tr><tr><td>Files remaining</td><td class="next">${all.t-all.d}</td></tr><tr><td>Sprints complete</td><td>${doneSp} / ${D.sprints.length}</td></tr><tr><td>Decisions logged</td><td>${D.decs.length}</td></tr></table>${note}`);
  const nx=next?win(`Up next: Sprint ${esc(next.id)}`,"",`<p>${inline(next.title)}</p>${lis(next.items)}${next.result?`<p class="mut">Goal: ${inline(next.result)}</p>`:""}`):"";
  const sub=win("Subsystems",Object.keys(groups).length,Object.entries(groups).map(([g,l])=>{const s=stats(l);return `<div class="line"><span>${inline(g)}</span>${bar(s.p,`${s.d}/${s.t}`)}</div>`}).join(""));
  const log=D.log.length?win("Change log","latest 5",`<div style="margin:-8px">${D.log.slice(-5).reverse().map(c=>`<div class="ent"><span class="acc">${esc(c.id)}</span> ${inline(c.text)}</div>`).join("")}</div>`,false):"";
  return `<div class="grid2"><div>${sum}${nx}</div><div>${sub}${log}</div></div>`;
}

function sprintsView(){
  return D.sprints.map(s=>{
    const fs=stats(D.files.filter(f=>f.sprint===s.id)),lab={done:"done",next:"next",plan:"planned"}[s.status];
    return `<details class="hd" ${s.status==="next"?"open":""}><summary><span>Sprint ${esc(s.id)}  ${inline(s.title)}${s.opt?" (optional)":""}</span><span class="r ${s.status}">${lab}</span></summary><div class="bd">${fs.t?bar(fs.p,`${fs.d}/${fs.t} tagged files`):""}${lis(s.items)}${s.result?`<p><span class="acc">Result:</span> ${inline(s.result)}</p>`:""}</div></details>`;
  }).join("");
}

function filesView(){
  const f=D.files.filter(x=>(x.done?sd:sp)&&(!q||(x.path+x.role).toLowerCase().includes(q)));
  const groups={};f.forEach(x=>(groups[x.group] ||= []).push(x));
  const tools=`<div class="tools"><input type="search" id="q" placeholder="Filter files…" value="${esc(q)}"><label><input class="ck" type="checkbox" id="cd" ${sd?"checked":""}>Done</label><label><input class="ck" type="checkbox" id="cp" ${sp?"checked":""}>Planned</label><span class="mut">${f.length} shown</span></div>`;
  if(!f.length)return tools+`<div class="card mut">No files match. Clear the filter, or tick Done and Planned.</div>`;
  return tools+Object.entries(groups).map(([g,l])=>{const s=stats(l);return `<details class="hd" ${q||!sd||!sp?"open":""}><summary><span>${inline(g)}</span><span class="r mut">${s.d}/${s.t}</span></summary><div class="bd" style="padding:0">${l.map(x=>`<div class="fr"><span class="cb ${x.done?"on":""}"></span><span><code>${esc(x.path)}</code>${x.sprint?` <span class="mut">sprint ${esc(x.sprint)}</span>`:""}</span><span class="mut">${inline(x.role)}</span></div>`).join("")}</div></details>`}).join("");
}

function decView(){
  return `<div class="win"><div style="padding:0">`+D.decs.map(d=>{const c=/resolved|adopted/i.test(d.status)?"done":/pending/i.test(d.status)?"next":"plan";
    return `<div class="ent"><b class="acc">${esc(d.id)}</b> ${inline(d.title)} ${d.status?`<span class="${c}">(${esc(d.status.split(/[:.]/)[0].toLowerCase().slice(0,24))})</span>`:""}<span class="mut">${inline(d.text)}</span></div>`}).join("")+`</div></div>`;
}

function render(){
  const tabs={overview:"Overview",sprints:"Sprints",files:"Files",decisions:"Decisions"};
  $("#tabs").innerHTML=Object.entries(tabs).map(([k,v])=>`<button data-t="${k}" class="${tab===k?"on":""}">${v}</button>`).join("");
  if(!D)return;
  $("#view").innerHTML={overview,sprints:sprintsView,files:filesView,decisions:decView}[tab]();
}

function load(md, src){
  try{
    D = parse(md);
    if (!D.files.length && !D.sprints.length) throw new Error("No plan data found in this text");
    $("#meta").textContent = `${src} · ${new Date().toLocaleTimeString()}`;
    $("#loadbox").innerHTML = ""; render();
  }catch(e){ showErr(e.message); }
}

function showErr(msg){
  $("#meta").textContent = "Couldn’t load";
  $("#loadbox").innerHTML = `<div class="card err"><h2>Couldn’t fetch PLAN.md live</h2><p class="mut">${esc(msg)}. Check your connection or that the repo is public, then hit Refresh. You can also paste the file’s text below or pick the file.</p><textarea id="ta" placeholder="Paste PLAN.md here…"></textarea><div class="tools" style="margin-top:8px"><button id="go">Build dashboard</button><input type="file" id="fi" accept=".md,.txt"></div></div>`;
}

async function fetchPlan(){
  $("#meta").textContent = "Fetching latest plan…";
  try{
    const r = await fetch(URL_, {cache:"no-store"});
    if (!r.ok) throw new Error("HTTP "+r.status);
    load(await r.text(), "Live from GitHub");
  }catch(e){ showErr(e.message || "Network error"); }
}

document.addEventListener("click", e=>{
  const t = e.target.closest("[data-t]"), f = e.target.closest("[data-f]");
  if (t){ tab = t.dataset.t; render(); }
  if (f){ filt = f.dataset.f; render(); }
  if (e.target.id==="go") load($("#ta").value, "Pasted text");
});
document.addEventListener("input", e=>{ if(e.target.id==="q"){ q=e.target.value.toLowerCase(); const p=e.target.selectionStart; render(); const n=$("#q"); n.focus(); n.setSelectionRange(p,p); } });
document.addEventListener("change",e=>{if(e.target.id==="cd"){sd=e.target.checked;render()}if(e.target.id==="cp"){sp=e.target.checked;render()}});
document.addEventListener("change", async e=>{ if(e.target.id==="fi" && e.target.files[0]) load(await e.target.files[0].text(), e.target.files[0].name); });
$("#reload").onclick = fetchPlan;
const setTheme=t=>{document.documentElement.dataset.theme=t;try{localStorage.setItem("jt",t)}catch(e){}};
try{const t=localStorage.getItem("jt");if(t)setTheme(t)}catch(e){}
$("#theme").onclick=()=>setTheme((document.documentElement.dataset.theme||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light"))==="dark"?"light":"dark");
render(); fetchPlan();
</script>
</body>
</html>
