name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore Dependencies
      run: dotnet restore -p:Configuration=Release

    - name: Build Solution
      run: dotnet build --no-restore --configuration Release

    - name: Run Unit Tests
      run: dotnet test tests/Jatayu.Tests --no-build --configuration Release --logger "console;verbosity=detailed"

    - name: Run Render Smoke Test (D20 Feature Probe)
      run: dotnet run --project tests/Jatayu.RenderSmoke --no-build --configuration Release

    - name: Publish Windows Release
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      shell: pwsh
      run: ./tools/Publish-Release.ps1

    - name: Archive Windows Release
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      shell: pwsh
      run: Compress-Archive -Path dist/Jatayu -DestinationPath dist/Jatayu-windows-x64.zip -CompressionLevel Optimal

    - name: Upload Windows Release
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: actions/upload-artifact@v4
      with:
        name: Jatayu-windows-x64
        path: dist/Jatayu-windows-x64.zip
        if-no-files-found: error

  linux-release:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Publish Linux Release
      shell: pwsh
      run: ./tools/Publish-Linux-Release.ps1

    - name: Verify Linux Release Executable
      run: |
        test -x dist/Jatayu-linux-x64/Jatayu
        file dist/Jatayu-linux-x64/Jatayu

    - name: Archive Linux Release
      run: tar -czf dist/Jatayu-linux-x64.tar.gz -C dist Jatayu-linux-x64

    - name: Upload Linux Release
      uses: actions/upload-artifact@v4
      with:
        name: Jatayu-linux-x64
        path: dist/Jatayu-linux-x64.tar.gz
        if-no-files-found: error

  publish-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [ build-and-test, linux-release ]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Download Windows Release
      uses: actions/download-artifact@v4
      with:
        name: Jatayu-windows-x64
        path: release-assets

    - name: Download Linux Release
      uses: actions/download-artifact@v4
      with:
        name: Jatayu-linux-x64
        path: release-assets

    - name: Create or Update Latest GitHub Release
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      shell: bash
      run: |
        tag="main-${GITHUB_SHA}"
        title="Jatayu main ${GITHUB_SHA:0:7}"
        notes="$(printf 'Automated release from push to main.\n\nCommit: %s\n' "$GITHUB_SHA")"

        if gh release view "$tag" >/dev/null 2>&1; then
          gh release upload "$tag" \
            release-assets/Jatayu-windows-x64.zip \
            release-assets/Jatayu-linux-x64.tar.gz \
            --clobber
          gh release edit "$tag" --title "$title" --notes "$notes" --latest
        else
          gh release create "$tag" \
            release-assets/Jatayu-windows-x64.zip \
            release-assets/Jatayu-linux-x64.tar.gz \
            --title "$title" \
            --notes "$notes" \
            --latest
        fi
