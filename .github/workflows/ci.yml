name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore Dependencies
      run: dotnet restore

    - name: Build Solution
      run: dotnet build --no-restore --configuration Release

    - name: Run Unit Tests
      run: dotnet test tests/Jatayu.Tests --no-build --configuration Release --logger "console;verbosity=detailed"

    - name: Run Render Smoke Test (D20 Feature Probe)
      run: dotnet run --project tests/Jatayu.RenderSmoke --no-build --configuration Release
